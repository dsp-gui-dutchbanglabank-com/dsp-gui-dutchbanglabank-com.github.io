<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Demo Certificate Management System
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #0f172a;
}

.header {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 18px 24px;
}

.header-inner {
  max-width: 1150px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.brand {
  font-size: 20px;
  font-weight: 700;
}

.demo {
  display: inline-block;
  margin-top: 5px;
  padding: 4px 9px;
  border-radius: 6px;
  background: #fef3c7;
  color: #92400e;
  font-size: 11px;
  font-weight: 700;
}

.container {
  max-width: 1150px;
  margin: 30px auto;
  padding: 0 20px;
}

.title {
  margin-bottom: 20px;
}

.title h1 {
  margin: 0 0 6px;
  font-size: 26px;
}

.title p {
  margin: 0;
  color: #64748b;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 20px;
}

.stat-label {
  color: #64748b;
  font-size: 14px;
}

.stat-number {
  margin-top: 8px;
  font-size: 28px;
  font-weight: 700;
}

.panel {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 25px;
}

.panel h2 {
  margin-top: 0;
  font-size: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.field label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 600;
}

.field input {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

.field input:focus,
.search-input:focus {
  border-color: #0055a5;
  box-shadow: 0 0 0 3px rgba(0,85,165,.1);
}

.actions {
  margin-top: 22px;
  display: flex;
  gap: 10px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 10px 15px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.save {
  background: #0055a5;
  color: white;
}

.clear {
  background: #e2e8f0;
  color: #334155;
}

.message {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  white-space: pre-line;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search-input {
  flex: 1;
  min-width: 250px;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}

.search-button {
  background: #0055a5;
  color: white;
}

.show-all-button {
  background: #e2e8f0;
  color: #334155;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 13px 10px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
  font-size: 14px;
  vertical-align: middle;
}

th {
  background: #f8fafc;
  color: #475569;
}

.empty {
  text-align: center;
  color: #64748b;
  padding: 25px;
}

.ref-cell {
  min-width: 260px;
  max-width: 360px;
  word-break: break-all;
  font-family: monospace;
  font-size: 11px;
}

.status-valid {
  color: #166534;
  font-weight: 700;
}

.status-revoked {
  color: #991b1b;
  font-weight: 700;
}

.status-button {
  color: white;
  min-width: 85px;
}

.status-button.valid-action {
  background: #15803d;
}

.status-button.valid-action:hover {
  background: #166534;
}

.status-button.revoke-action {
  background: #dc2626;
}

.status-button.revoke-action:hover {
  background: #b91c1c;
}

.delete-button {
  background: #111827;
  color: white;
  margin-left: 5px;
}

.delete-button:hover {
  background: #000000;
}

.action-cell {
  white-space: nowrap;
}

@media (max-width: 800px) {

  .cards,
  .form-grid {
    grid-template-columns: 1fr;
  }

  .header-inner {
    align-items: flex-start;
    flex-direction: column;
  }

  .action-cell {
    white-space: normal;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="header-inner">

    <div>

      <div class="brand">
        Demo-Bangla Bank PLC.
      </div>


    </div>

    <strong>
      Admin Dashboard
    </strong>

  </div>

</header>


<main class="container">

  <div class="title">

    <h1>
      Welcome, Administrator
    </h1>

    <p>
      Demo Certificate Management System
    </p>

  </div>


  <!-- STATISTICS -->

  <div class="cards">

    <div class="stat">

      <div class="stat-label">
        Total Certificates
      </div>

      <div
        class="stat-number"
        id="totalCertificates"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Valid Certificates
      </div>

      <div
        class="stat-number"
        id="validCertificates"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Revoked Certificates
      </div>

      <div
        class="stat-number"
        id="revokedCertificates"
      >
        0
      </div>

    </div>

  </div>


  <!-- ADD CERTIFICATE -->

  <section class="panel">

    <h2>
      + Add Certificate
    </h2>

    <div class="form-grid">

      <div class="field">

        <label for="accountNo">
          Account No
        </label>

        <input
          id="accountNo"
          type="text"
          placeholder="Enter account number"
        >

      </div>


      <div class="field">

        <label for="accountName">
          Account Name
        </label>

        <input
          id="accountName"
          type="text"
          placeholder="Enter account name"
        >

      </div>


      <div class="field">

        <label for="balance">
          Report Date Balance
        </label>

        <input
          id="balance"
          type="text"
          placeholder="Enter balance"
        >

      </div>


      <div class="field">

        <label for="reportDate">
          Report Generation Date
        </label>

        <input
          id="reportDate"
          type="text"
          placeholder="Example: 12-Aug-2026"
        >

      </div>

    </div>


    <div class="actions">

      <button
        class="save"
        id="saveButton"
        onclick="saveCertificate()"
      >
        SAVE CERTIFICATE
      </button>


      <button
        class="clear"
        onclick="clearForm()"
      >
        CLEAR
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </section>


  <!-- CERTIFICATE LIST -->

  <section class="panel">

    <h2>
      Certificate List
    </h2>


    <div class="search-box">

      <input
        id="searchCertificate"
        class="search-input"
        type="text"
        placeholder="Search by REF, Account No or Account Name"
        onkeydown="handleSearchKey(event)"
      >


      <button
        class="search-button"
        onclick="searchCertificates()"
      >
        SEARCH
      </button>


      <button
        class="show-all-button"
        onclick="loadCertificates()"
      >
        SHOW ALL
      </button>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>REF</th>

            <th>Account No</th>

            <th>Account Name</th>

            <th>Balance</th>

            <th>Generation Date</th>

            <th>Status</th>

            <th>Action</th>

          </tr>

        </thead>


        <tbody id="certificateTable">

          <tr>

            <td
              colspan="7"
              class="empty"
            >
              Loading certificates...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbztvLiNtMmyyDB1krhxOCON4hBV4evMyyvNitn3rbN0HxrmfZXckDtBrLFgoevKnuqtKQ/exec";


let certificates = [];


/* =====================================================
   SAVE
===================================================== */

async function saveCertificate() {

  const accountNo =
    document
      .getElementById("accountNo")
      .value
      .trim();


  const accountName =
    document
      .getElementById("accountName")
      .value
      .trim();


  const balance =
    document
      .getElementById("balance")
      .value
      .trim();


  const reportDate =
    document
      .getElementById("reportDate")
      .value
      .trim();


  if (
    !accountNo ||
    !accountName ||
    !balance ||
    !reportDate
  ) {

    showMessage(
      "Please fill in all fields.",
      true
    );

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = true;

  button.textContent =
    "SAVING...";


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              accountNo:
                accountNo,

              accountName:
                accountName,

              balance:
                balance,

              reportDate:
                reportDate

            })

        }
      );


    const result =
      await response.json();


    if (!result.success) {

      showMessage(
        result.message ||
        "Could not save certificate.",
        true
      );

      return;

    }


    clearForm();


    showMessage(

      "Certificate saved successfully.\n\nREF:\n" +
      result.ref

    );


    loadCertificates();


  } catch (error) {

    console.error(error);


    showMessage(
      "Could not connect to Google Apps Script.",
      true
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "SAVE CERTIFICATE";

  }

}


/* =====================================================
   LOAD
===================================================== */

function loadCertificates() {

  const table =
    document.getElementById(
      "certificateTable"
    );


  table.innerHTML = `

    <tr>

      <td
        colspan="7"
        class="empty"
      >
        Loading certificates...
      </td>

    </tr>

  `;


  requestAppsScript(
    "action=list",
    function(result) {

      if (
        !result ||
        !result.success
      ) {

        showConnectionError();

        return;

      }


      certificates =
        Array.isArray(
          result.certificates
        )
          ? result.certificates
          : [];


      renderCertificates();

    }
  );

}


/* =====================================================
   SEARCH
===================================================== */

function searchCertificates() {

  const input =
    document.getElementById(
      "searchCertificate"
    );


  const query =
    input.value.trim();


  if (!query) {

    loadCertificates();

    return;

  }


  const table =
    document.getElementById(
      "certificateTable"
    );


  table.innerHTML = `

    <tr>

      <td
        colspan="7"
        class="empty"
      >
        Searching...
      </td>

    </tr>

  `;


  requestAppsScript(

    "action=search&q=" +
    encodeURIComponent(query),

    function(result) {

      if (
        !result ||
        !result.success
      ) {

        showMessage(
          "Search failed.",
          true
        );

        return;

      }


      certificates =
        Array.isArray(
          result.certificates
        )
          ? result.certificates
          : [];


      renderCertificates();

    }

  );

}


/* =====================================================
   TOGGLE VALID / REVOKED
===================================================== */

function toggleStatus(ref, currentStatus) {

  const status =
    String(
      currentStatus || "VALID"
    ).toUpperCase();


  const nextStatus =
    status === "VALID"
      ? "REVOKED"
      : "VALID";


  const confirmed =
    confirm(

      "Change certificate status?\n\n" +

      "REF:\n" +
      ref +

      "\n\nCurrent: " +
      status +

      "\nNew: " +
      nextStatus

    );


  if (!confirmed) {
    return;
  }


  requestAppsScript(

    "action=toggleStatus&ref=" +
    encodeURIComponent(ref),

    function(result) {

      if (
        !result ||
        !result.success
      ) {

        showMessage(

          result &&
          result.message
            ? result.message
            : "Could not change status.",

          true

        );

        return;

      }


      showMessage(

        "Status updated successfully.\n\n" +
        result.oldStatus +
        " → " +
        result.status

      );


      loadCertificates();

    }

  );

}


/* =====================================================
   DELETE
===================================================== */

function deleteCertificate(ref) {

  const confirmed =
    confirm(

      "WARNING!\n\n" +
      "This certificate will be permanently deleted.\n\n" +
      "REF:\n" +
      ref +
      "\n\n" +
      "Continue?"

    );


  if (!confirmed) {
    return;
  }


  requestAppsScript(

    "action=delete&ref=" +
    encodeURIComponent(ref),

    function(result) {

      if (
        !result ||
        !result.success
      ) {

        showMessage(

          result &&
          result.message
            ? result.message
            : "Could not delete certificate.",

          true

        );

        return;

      }


      showMessage(
        "Certificate deleted successfully."
      );


      loadCertificates();

    }

  );

}


/* =====================================================
   JSONP REQUEST
===================================================== */

function requestAppsScript(
  parameters,
  callback
) {

  const callbackName =
    "certificateCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 1000000
    );


  const script =
    document.createElement(
      "script"
    );


  let finished = false;


  const timeout =
    setTimeout(

      function() {

        if (finished) {
          return;
        }


        finished = true;

        cleanup();

        showConnectionError();

      },

      15000

    );


  window[callbackName] =
    function(result) {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      callback(result);

    };


  script.src =
    API_URL +
    "?" +
    parameters +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      finished = true;


      clearTimeout(
        timeout
      );


      cleanup();


      showConnectionError();

    };


  document
    .body
    .appendChild(
      script
    );


  function cleanup() {

    if (
      script.parentNode
    ) {

      script
        .parentNode
        .removeChild(
          script
        );

    }


    try {

      delete window[
        callbackName
      ];

    } catch (error) {

      window[
        callbackName
      ] = undefined;

    }

  }

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderCertificates() {

  const table =
    document.getElementById(
      "certificateTable"
    );


  table.innerHTML = "";


  certificates.forEach(
    function(cert) {

      const row =
        document.createElement(
          "tr"
        );


      const status =
        String(
          cert.status ||
          "VALID"
        ).toUpperCase();


      const statusClass =
        status === "VALID"
          ? "status-valid"
          : "status-revoked";


      /*
        VALID:
          REVOKE + DELETE

        REVOKED:
          VALID + DELETE
      */


      let statusButton = "";


      if (
        status === "VALID"
      ) {

        statusButton = `

          <button
            class="status-button revoke-action"
            onclick="toggleStatus(
              '${escapeJs(cert.ref)}',
              'VALID'
            )"
          >
            REVOKE
          </button>

        `;

      } else {

        statusButton = `

          <button
            class="status-button valid-action"
            onclick="toggleStatus(
              '${escapeJs(cert.ref)}',
              'REVOKED'
            )"
          >
            VALID
          </button>

        `;

      }


      const action = `

        ${statusButton}

        <button
          class="delete-button"
          onclick="deleteCertificate(
            '${escapeJs(cert.ref)}'
          )"
        >
          DELETE
        </button>

      `;


      row.innerHTML = `

        <td class="ref-cell">

          ${escapeHtml(
            cert.ref || ""
          )}

        </td>


        <td>

          ${escapeHtml(
            cert.accountNo || ""
          )}

        </td>


        <td>

          ${escapeHtml(
            cert.accountName || ""
          )}

        </td>


        <td>

          ${escapeHtml(
            cert.balance || ""
          )}

        </td>


        <td>

          ${escapeHtml(
            cert.reportDate || ""
          )}

        </td>


        <td class="${statusClass}">

          ${escapeHtml(
            status
          )}

        </td>


        <td class="action-cell">

          ${action}

        </td>

      `;


      table.appendChild(
        row
      );

    }
  );


  if (
    certificates.length === 0
  ) {

    table.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty"
        >
          No certificates found.
        </td>

      </tr>

    `;

  }


  updateStatistics();

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics() {

  document
    .getElementById(
      "totalCertificates"
    )
    .textContent =
    certificates.length;


  document
    .getElementById(
      "validCertificates"
    )
    .textContent =

    certificates.filter(

      function(cert) {

        return (

          String(
            cert.status ||
            ""
          ).toUpperCase() ===
          "VALID"

        );

      }

    ).length;


  document
    .getElementById(
      "revokedCertificates"
    )
    .textContent =

    certificates.filter(

      function(cert) {

        return (

          String(
            cert.status ||
            ""
          ).toUpperCase() ===
          "REVOKED"

        );

      }

    ).length;

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

  document
    .getElementById(
      "accountNo"
    )
    .value = "";


  document
    .getElementById(
      "accountName"
    )
    .value = "";


  document
    .getElementById(
      "balance"
    )
    .value = "";


  document
    .getElementById(
      "reportDate"
    )
    .value = "";

}


/* =====================================================
   ENTER KEY
===================================================== */

function handleSearchKey(
  event
) {

  if (
    event.key === "Enter"
  ) {

    searchCertificates();

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  error = false
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.style.display =
    "block";


  message.style.background =
    error
      ? "#fee2e2"
      : "#dcfce7";


  message.style.color =
    error
      ? "#991b1b"
      : "#166534";


  clearTimeout(
    window.messageTimer
  );


  window.messageTimer =
    setTimeout(

      function() {

        message.style.display =
          "none";

      },

      6000

    );

}


/* =====================================================
   CONNECTION ERROR
===================================================== */

function showConnectionError() {

  const table =
    document.getElementById(
      "certificateTable"
    );


  table.innerHTML = `

    <tr>

      <td
        colspan="7"
        class="empty"
      >
        Connection failed.
        Please check Apps Script deployment.
      </td>

    </tr>

  `;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJs(
  value
) {

  return String(
    value
  )

    .replaceAll(
      "\\",
      "\\\\"
    )

    .replaceAll(
      "'",
      "\\'"
    )

    .replaceAll(
      "\n",
      "\\n"
    )

    .replaceAll(
      "\r",
      "\\r"
    );

}


/* =====================================================
   START
===================================================== */

loadCertificates();

</script>

</body>

</html>
