<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Demo Certificate Verification</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #0f172a;
}

.header {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  padding: 20px;
}

.header-inner {
  max-width: 850px;
  margin: auto;
  text-align: center;
}

.brand {
  font-size: 22px;
  font-weight: 700;
}

.demo {
  display: inline-block;
  margin-top: 7px;
  padding: 5px 10px;
  border-radius: 6px;
  background: #fef3c7;
  color: #92400e;
  font-size: 11px;
  font-weight: 700;
}

.container {
  max-width: 850px;
  margin: 35px auto;
  padding: 0 20px;
}

.card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 15px;
  padding: 28px;
  box-shadow: 0 4px 18px rgba(15,23,42,.05);
}

.title {
  text-align: center;
  margin-bottom: 25px;
}

.title h1 {
  margin: 0 0 7px;
  font-size: 25px;
}

.title p {
  margin: 0;
  color: #64748b;
}

.status-box {
  text-align: center;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 25px;
  font-size: 20px;
  font-weight: 800;
}

.valid {
  background: #dcfce7;
  color: #166534;
}

.revoked {
  background: #fee2e2;
  color: #991b1b;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.loading {
  background: #f1f5f9;
  color: #475569;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.info {
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 15px;
}

.label {
  color: #64748b;
  font-size: 12px;
  margin-bottom: 6px;
}

.value {
  font-size: 15px;
  font-weight: 600;
  word-break: break-word;
}

.ref {
  font-family: monospace;
  font-size: 11px;
}

.footer {
  margin-top: 22px;
  text-align: center;
  color: #64748b;
  font-size: 12px;
}

.refresh-button {
  display: block;
  margin: 20px auto 0;
  border: 0;
  background: #0055a5;
  color: #ffffff;
  padding: 11px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.refresh-button:hover {
  background: #00447f;
}

@media (max-width: 650px) {

  .info-grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 20px;
  }

}

</style>

</head>


<body>


<header class="header">

<div class="header-inner">

<div class="brand">
Demo-Bangla Bank PLC.
</div>

<span class="demo">
DEMO SYSTEM
</span>

</div>

</header>


<main class="container">


<div class="card">


<div class="title">

<h1>
Certificate Verification
</h1>

<p>
Demo Certificate Verification System
</p>

</div>


<div
id="statusBox"
class="status-box loading"
>
VERIFYING...
</div>


<div
id="certificateInfo"
style="display:none;"
>


<div class="info-grid">


<div class="info">

<div class="label">
REF
</div>

<div
id="ref"
class="value ref"
>
-
</div>

</div>


<div class="info">

<div class="label">
Account No
</div>

<div
id="accountNo"
class="value"
>
-
</div>

</div>


<div class="info">

<div class="label">
Account Name
</div>

<div
id="accountName"
class="value"
>
-
</div>

</div>


<div class="info">

<div class="label">
Balance
</div>

<div
id="balance"
class="value"
>
-
</div>

</div>


<div class="info">

<div class="label">
Report Generation Date
</div>

<div
id="reportDate"
class="value"
>
-
</div>

</div>


<div class="info">

<div class="label">
Current Status
</div>

<div
id="currentStatus"
class="value"
>
-
</div>

</div>


</div>


<button
class="refresh-button"
onclick="verifyCertificate()"
>
REFRESH VERIFICATION
</button>


</div>


<div
id="footer"
class="footer"
>
This is a DEMO certificate verification system.
</div>


</div>


</main>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbztvLiNtMmyyDB1krhxOCON4hBV4evMyyvNitn3rbN0HxrmfZXckDtBrLFgoevKnuqtKQ/exec";


/* =====================================================
   GET REF FROM URL
===================================================== */

function getRefFromUrl() {

const params =
new URLSearchParams(
window.location.search
);


let ref =
params.get("ref") || "";


ref =
ref.trim();


/*
   If someone supplies:
   ref=ref=1234~TOKEN

   remove the extra "ref="
*/

if (
ref.toLowerCase().startsWith("ref=")
) {

ref =
ref.substring(4);

}


return ref.trim();

}


/* =====================================================
   VERIFY
===================================================== */

function verifyCertificate() {

const ref =
getRefFromUrl();


const statusBox =
document.getElementById(
"statusBox"
);


const info =
document.getElementById(
"certificateInfo"
);


if (!ref) {

statusBox.className =
"status-box error";

statusBox.textContent =
"REF IS REQUIRED";

info.style.display =
"none";

return;

}


statusBox.className =
"status-box loading";

statusBox.textContent =
"VERIFYING...";

info.style.display =
"none";


requestAppsScript(

"ref=" +
encodeURIComponent(ref),

function(result) {


if (
!result ||
!result.success
) {

statusBox.className =
"status-box error";

statusBox.textContent =
"NOT FOUND";

info.style.display =
"none";

return;

}


const status =
String(
result.status ||
"VALID"
).toUpperCase();


document.getElementById(
"ref"
).textContent =
result.ref || "-";


document.getElementById(
"accountNo"
).textContent =
result.accountNo || "-";


document.getElementById(
"accountName"
).textContent =
result.accountName || "-";


document.getElementById(
"balance"
).textContent =
result.balance || "-";


document.getElementById(
"reportDate"
).textContent =
result.reportDate || "-";


document.getElementById(
"currentStatus"
).textContent =
status;


info.style.display =
"block";


if (
status === "REVOKED"
) {

statusBox.className =
"status-box revoked";

statusBox.textContent =
"REVOKED";

} else {

statusBox.className =
"status-box valid";

statusBox.textContent =
"VALID";

}


}

);

}


/* =====================================================
   JSONP REQUEST
===================================================== */

function requestAppsScript(
parameters,
callback
) {

const callbackName =
"verifyCallback_" +
Date.now() +
"_" +
Math.floor(
Math.random() * 1000000
);


const script =
document.createElement(
"script"
);


let finished = false;


const timeout =
setTimeout(
function() {

if (finished) {
return;
}

finished = true;

cleanup();

showError();

},
15000
);


window[callbackName] =
function(result) {

if (finished) {
return;
}

finished = true;

clearTimeout(
timeout
);

cleanup();

callback(result);

};


script.src =
API_URL +
"?" +
parameters +
"&callback=" +
encodeURIComponent(
callbackName
);


script.onerror =
function() {

if (finished) {
return;
}

finished = true;

clearTimeout(
timeout
);

cleanup();

showError();

};


document.body.appendChild(
script
);


function cleanup() {

if (script.parentNode) {

script.parentNode.removeChild(
script
);

}


try {

delete window[callbackName];

} catch (error) {

window[callbackName] =
undefined;

}

}

}


/* =====================================================
   ERROR
===================================================== */

function showError() {

const statusBox =
document.getElementById(
"statusBox"
);


const info =
document.getElementById(
"certificateInfo"
);


statusBox.className =
"status-box error";

statusBox.textContent =
"CONNECTION ERROR";

info.style.display =
"none";

}


/* =====================================================
   START
===================================================== */

verifyCertificate();

</script>


</body>

</html>
