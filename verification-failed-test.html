<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Verification Failed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f9fafb;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 48px 32px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .icon {
      width: 72px;
      height: 72px;

      margin: 0 auto 24px;

      border-radius: 50%;

      background: #fee2e2;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #dc2626;

      font-size: 38px;
      font-weight: 700;
    }

    .title {
      margin: 0;

      color: #dc2626;

      font-size: 30px;
      font-weight: 700;

      line-height: 1.25;
    }

    .message {
      margin: 16px auto 0;

      max-width: 500px;

      color: #6b7280;

      font-size: 16px;
      line-height: 1.7;
    }

    .ok-button {
      margin-top: 32px;

      min-width: 120px;

      border: 0;
      border-radius: 12px;

      padding: 13px 28px;

      background: #111827;
      color: #ffffff;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .ok-button:hover {
      opacity: 0.9;
    }

    .ok-button:active {
      transform: scale(0.97);
    }

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 36px 22px;
        border-radius: 20px;
      }

      .icon {
        width: 64px;
        height: 64px;
        font-size: 32px;
      }

      .title {
        font-size: 25px;
      }

      .message {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="icon">
        !
      </div>

      <h1 class="title">
        Verification Failed
      </h1>

      <p class="message">
        We couldn't verify the authenticity of the QR code
        or certificate reference.
      </p>

      <button
        class="ok-button"
        onclick="history.back()"
      >
        OK
      </button>

    </div>

  </div>

</body>
</html>
