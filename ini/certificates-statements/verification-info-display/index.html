<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Verification</title>
<style>
:root{--primary:#0b5cab;--dark:#12324a;--muted:#6b7280;--line:#dbe4ee;--bg:#f3f7fb;--danger:#b42318;--success:#087443}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#172b3a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:720px;background:#fff;border-radius:18px;box-shadow:0 12px 35px #17324a18;overflow:hidden;border:1px solid #e7eef5}.top{background:linear-gradient(135deg,#0b5cab,#12324a);color:#fff;padding:28px 30px;text-align:center}.top h1{margin:0;font-size:25px}.top p{margin:8px 0 0;opacity:.88;font-size:14px}.body{padding:30px}.search{display:flex;gap:10px;margin-bottom:22px}.search input{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:10px;padding:14px;font-size:15px;outline:none}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #0b5cab18}.search button{border:0;border-radius:10px;background:var(--primary);color:#fff;padding:0 22px;font-weight:700;cursor:pointer}.search button:hover{filter:brightness(.95)}.result{border:1px solid var(--line);border-radius:14px;overflow:hidden}.result-head{padding:20px;background:#f7fafc;border-bottom:1px solid var(--line);text-align:center}.result-head h2{font-size:21px;margin:0 0 8px;color:var(--dark)}.badge{display:inline-block;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;background:#e7f7ee;color:var(--success)}.fields{padding:8px 22px 18px}.field{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid #edf2f7}.field:last-child{border-bottom:0}.label{color:var(--muted);font-size:14px}.value{text-align:right;font-weight:700;font-size:14px;overflow-wrap:anywhere}.failed{padding:30px;text-align:center;color:var(--danger);background:#fff5f4;border:1px solid #f3c6c2;border-radius:14px}.failed h2{margin:0 0 8px;font-size:21px}.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}.footer{text-align:center;font-size:12px;color:#8a98a7;padding:0 30px 25px}.hidden{display:none!important}@media(max-width:520px){body{padding:12px}.body{padding:20px}.top{padding:24px 18px}.search{flex-direction:column}.search button{padding:13px}.field{flex-direction:column;gap:7px}.value{text-align:left}}
</style>
</head>
<body>
<main class="card">
  <header class="top"><h1>Account Verification</h1><p>Verify your account certificate or statement reference</p></header>
  <section class="body">
    <form class="search" id="verifyForm">
      <input id="refInput" type="text" placeholder="Enter Certificate REF or Statement REF" autocomplete="off" required />
      <button type="submit">Verify</button>
    </form>
    <div id="result"></div>
    <p class="hint">Enter the reference exactly as shown on your certificate or statement.</p>
  </section>
  <footer class="footer">Copyright © 2026. Account Verification</footer>
</main>
<script>
/* Keep data.json beside this HTML file, or change DATA_URL below. */
const DATA_URL = './data.json';
const result = document.getElementById('result');
const input = document.getElementById('refInput');

function normalizeRef(value){
  return String(value ?? '').trim().replace(/\s+/g,'').toUpperCase();
}
function text(value){
  return value === undefined || value === null || value === '' ? '—' : String(value);
}
function recordsFromData(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data?.certificates)) return data.certificates;
  if(Array.isArray(data?.data)) return data.data;
  return [];
}
function findRecord(records, requestedRef){
  /* Type-specific matching is intentional because paired records share both refs. */
  const statement = records.find(item =>
    String(item?.type || '').toUpperCase() === 'STATEMENT' &&
    normalizeRef(item?.statementRef ?? item?.ref) === requestedRef
  );
  const certificate = records.find(item =>
    String(item?.type || '').toUpperCase() === 'CERTIFICATE' &&
    normalizeRef(item?.certificateRef ?? item?.ref) === requestedRef
  );
  return statement || certificate || records.find(item => [item?.ref,item?.certificateRef,item?.statementRef].some(v => normalizeRef(v) === requestedRef));
}
function showFailed(){
  result.innerHTML = '<div class="failed"><h2>Verification Failed</h2><p>The reference number is invalid or could not be found.</p></div>';
}
function showRecord(item, requestedRef){
  const type = String(item?.type || '').toUpperCase();
  const isStatement = type === 'STATEMENT' || normalizeRef(item?.statementRef) === requestedRef && normalizeRef(item?.certificateRef) !== requestedRef;
  const title = isStatement ? 'Account Statement Verification' : 'Account Certificate Verification';
  const status = String(item?.status || 'VALID').toUpperCase();
  if(status === 'REVOKED'){
    result.innerHTML = '<div class="failed"><h2>Certificate Revoked</h2><p>This document has been revoked and is no longer valid.</p></div>';
    return;
  }
  const fields = isStatement ? [
    ['Account No', item?.accountNo],
    ['Account Name', item?.accountName],
    ['Opening Balance', item?.openingBalance],
    ['Closing Balance', item?.closingBalance ?? item?.reportDateBalance ?? item?.balance],
    ['Report Generation Date', item?.reportGenerationDate ?? item?.reportDate]
  ] : [
    ['Account No', item?.accountNo],
    ['Account Name', item?.accountName],
    ['Report Date Balance', item?.reportDateBalance ?? item?.balance ?? item?.closingBalance],
    ['Report Generation Date', item?.reportGenerationDate ?? item?.reportDate]
  ];
  result.innerHTML = `<div class="result"><div class="result-head"><h2>${title}</h2><span class="badge">VERIFICATION SUCCESSFUL</span></div><div class="fields">${fields.map(([label,value]) => `<div class="field"><span class="label">${label}</span><span class="value">${escapeHtml(text(value))}</span></div>`).join('')}</div></div>`;
}
function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
async function verify(ref){
  const requestedRef = normalizeRef(ref);
  if(!requestedRef){showFailed();return;}
  result.innerHTML = '<p class="hint">Verifying…</p>';
  try{
    const response = await fetch(DATA_URL, {cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load data');
    const data = await response.json();
    const item = findRecord(recordsFromData(data), requestedRef);
    if(!item){showFailed();return;}
    showRecord(item, requestedRef);
  }catch(error){
    result.innerHTML = '<div class="failed"><h2>Verification Unavailable</h2><p>Data could not be loaded. Please try again later.</p></div>';
    console.error(error);
  }
}
document.getElementById('verifyForm').addEventListener('submit', event => {event.preventDefault();verify(input.value);});
const initialRef = new URLSearchParams(location.search).get('ref');
if(initialRef){input.value = initialRef;verify(initialRef);}
</script>
</body>
</html>
